[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-guard-scanner"
version = "0.1.0"
description = "Security scanner and runtime firewall for LLM applications, mapped to the OWASP Top 10 for LLM Applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "llm-guard contributors" }]
keywords = [
    "llm",
    "security",
    "prompt-injection",
    "jailbreak",
    "owasp",
    "ai-security",
    "firewall",
    "red-team",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/BasitS-hash/llm-guard"
Repository = "https://github.com/BasitS-hash/llm-guard"
Issues = "https://github.com/BasitS-hash/llm-guard/issues"

[project.optional-dependencies]
examples = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
llm-guard = "llm_guard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_guard"]

[tool.hatch.build.targets.sdist]
include = ["src/llm_guard", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
# UP042: str+Enum mixin is deliberate (stable JSON/CLI string values).
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately embed fullwidth/obfuscated unicode as attack fixtures.
"tests/*" = ["RUF001", "RUF002", "RUF003"]
# Module embeds zero-width/leetspeak characters as detection data.
"src/llm_guard/normalize.py" = ["RUF001", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
files = ["src/llm_guard"]

[[tool.mypy.overrides]]
module = ["typer.*", "rich.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["llm_guard"]
omit = ["src/llm_guard/cli.py"]

[tool.bandit]
exclude_dirs = ["tests", "examples"]
